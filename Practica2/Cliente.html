<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Cafetería</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f9f9f9; }
        .contenedor { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 8px 15px; cursor: pointer; background-color: #2196F3; color: white; border: none; border-radius: 4px; margin-right: 5px; }
        .panel-compra { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-top: 15px; margin-bottom: 15px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-right: 10px; width: 80px; }
        .consola { background: #e0e0e0; padding: 15px; border-radius: 5px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>CLIENTE</h2>

        <div>
            <button onclick="mostrarCatalogo()">Ver Menú</button>
            <button onclick="verResumen()">Ver Cuenta Total</button>
        </div>

        <div class="panel-compra">
            <label>ID Producto:</label>
            <input type="number" id="inputId" min="1">

            <label>Cantidad:</label>
            <input type="number" id="inputCantidad" min="1">

            <button onclick="agregarAlCarrito()" style="background-color: #4CAF50;">Agregar a la Orden</button>
        </div>

        <div id="pantalla" class="consola">
            <p>Caja abierta. Selecciona una opción para comenzar.</p>
        </div>
    </div>

    <script src="logica_cliente.js"></script>
</body>
</html>
